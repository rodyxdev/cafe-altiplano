<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#2a1a12">

  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">

</head>
<body>
  <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

  <header class="encabezado">

        <svg class="marca__grano" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="12" cy="12" rx="7" ry="10" fill="#c9a87c" transform="rotate(-25 12 12)"/>
          <path d="M12 3c-2 3-2 15 0 18" stroke="#2a1a12" stroke-width="1.6" fill="none" transform="rotate(-25 12 12)"/>
        </svg>
        <span>
          Café Altiplano
          <span class="marca__sub">Tueste artesanal</span>
        </span>
      </a>

      <nav class="nav" aria-label="Principal">
        <a class="nav__enlace" href="/index.html">Catálogo</a>
        <a class="boton-carrito" href="/carrito.html" data-boton-carrito>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>

          <span class="boton-carrito__texto">Carrito</span>
          <span class="contador-carrito" data-contador-carrito data-vacio="true">0</span>

      </nav>
    </div>

  <main id="contenido">
    <div class="contenedor">
      <nav class="migas" aria-label="Ruta de navegación">
        <a href="/index.html">Catálogo</a>
        <span aria-hidden="true">/</span>
        <span id="migas-nombre">Producto</span>
      </nav>

      <div class="detalle" id="detalle-producto">
        <div class="esqueleto" aria-hidden="true"></div>
        <div class="esqueleto" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor pie__contenido">
      <p>© 2026 Café Altiplano · Tueste artesanal mexicano</p>
      <p>Hecho en México · Precios en MXN</p>
    </div>
  </footer>

  <div class="avisos" role="status" aria-live="polite"></div>

  <script src="/js/tienda.js"></script>
  <script src="/js/producto.js"></script>
