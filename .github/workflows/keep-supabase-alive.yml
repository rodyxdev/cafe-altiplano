name: Keep Supabase alive

# Los proyectos gratuitos de Supabase se pausan tras 7 días sin actividad.
# Este es el primer proyecto del segundo Supabase compartido del portafolio
# (lo usarán también los Proyectos 6 y 7), así que este workflow lo mantiene
# despierto para todos.
#
# A diferencia del de Estudio Lumen, no le pega directo a la API REST de
# Supabase: hace un GET al catálogo público de producción. Eso ejercita la
# ruta completa (Vercel -> Express -> Supabase) y no necesita ningún secret
# en el repositorio.
on:
  schedule:
    # 12:00 UTC los días 1, 4, 7, ..., 28 y 31 de cada mes. En el cambio de
    # mes la separación nunca pasa de 3 días, lejos del umbral de 7.
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: GET /api/products en producción
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      URL_PRODUCCION: https://cafe-altiplano.vercel.app

    steps:
      - name: Ping al catálogo
        run: |
          set -euo pipefail

          cuerpo=$(mktemp)
          status=$(curl -s -o "$cuerpo" -w '%{http_code}' \
            --max-time 30 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -H 'Accept: application/json' \
            "${URL_PRODUCCION}/api/products")

          echo "HTTP ${status}"

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::El catálogo devolvió HTTP ${status}. Supabase puede estar pausado o el despliegue caído."
            exit 1
          fi

          # Un 200 no basta: hay que confirmar que la respuesta vino de la base
          # (un arreglo de productos) y no de una página de error.
          productos=$(jq 'if type == "array" then length else -1 end' "$cuerpo")
          echo "Productos recibidos: ${productos}"

          if [ "${productos}" -lt 1 ]; then
            echo "::error::La respuesta no trae productos; la consulta a Supabase no se completó."
            exit 1
          fi

          echo "Supabase respondió con ${productos} productos; el proyecto sigue activo."
